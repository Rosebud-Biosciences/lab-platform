# Shared terraform-docs config. Run per module, e.g.:
#   terraform-docs -c .terraform-docs.yml modules/network
formatter: markdown table

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  description: true
  hide-empty: true
  required: true
  sensitive: true
  type: true
