# Shared terraform-docs config. Run per module, e.g.:
#   terraform-docs -c .terraform-docs.yml aws/network
formatter: markdown table

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  color: true
  description: true
  # Never read .terraform.lock.hcl: a locally inited module would otherwise
  # render resolved provider versions where CI (no lock files, gitignored)
  # renders the constraints, and the docs check would fail on the diff.
  lockfile: false
  hide-empty: true
  required: true
  sensitive: true
  type: true
