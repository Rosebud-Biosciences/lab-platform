# Adapted from Data on EKS (github.com/awslabs/data-on-eks, Apache-2.0), with changes; see NOTICE.
autoDiscovery:
  clusterName: ${eks_cluster_id}

awsRegion: ${aws_region}

cloudProvider: aws

extraArgs:
  aws-use-static-instance-list: true

resources:
  limits:
    cpu: 1000m
    memory: 1G
  requests:
    cpu: 200m
    memory: 512Mi

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
