apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.name }}
spec:
  # Select the latest EKS-optimized AMI for the configured family.
  # Valid families: AL2, AL2023, Bottlerocket (Ubuntu was dropped in Karpenter v1).
  amiSelectorTerms:
    - alias: {{ lower .Values.amiFamily }}@latest
  # Node IAM role; Karpenter manages the instance profile itself.
  role: {{ .Values.nodeRole }}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 200Gi
        volumeType: gp3
        encrypted: true
  # RAID0 ephemeral NVMe instance-store volumes for node ephemeral storage.
  instanceStorePolicy: RAID0
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  subnetSelectorTerms:
    - tags:
        Name: {{ .Values.vpcName }}-private*
  securityGroupSelectorTerms:
    - tags:
        Name: {{ .Values.clusterName }}-node*
  tags:
    InstanceType: {{ .Values.name }}
