# JupyterHub with a generic OIDC authenticator: any provider (Google, Cognito,
# Okta, Keycloak) via the jupyterhub_oidc_* variables. The username (and so the
# {username} home sub-path and admin/allowed matching) comes from
# oidc_username_claim — "email" by default.
#
# allowed_users/allow_all still gate who may log in AFTER the IdP
# authenticates; with allow_all any account the IdP admits gets a pod, so
# durable deployments should set jupyterhub_allowed_users (or restrict the IdP
# app to the org).
hub:
  config:
    JupyterHub:
      authenticator_class: generic-oauth
      # A hub login lasts this long (default 14 days); the IdP decides again after.
      cookie_max_age_days: ${cookie_max_age_days}
    GenericOAuthenticator:
      # Keep the tokens (encrypted; the chart generates CryptKeeper's key) and
      # refresh the user -- groups included -- before every spawn once they are
      # older than auth_refresh_age: removing someone from a group stops their
      # next server, not their next hub login.
      enable_auth_state: true
      refresh_pre_spawn: true
      auth_refresh_age: ${auth_refresh_age}
      client_id: ${oidc_client_id}
      client_secret: ${oidc_client_secret}
      oauth_callback_url: ${oidc_callback_url}
      authorize_url: ${oidc_authorize_url}
      token_url: ${oidc_token_url}
      userdata_url: ${oidc_userdata_url}
      scope: ${oidc_scopes}
      username_claim: ${oidc_username_claim}
      login_service: ${oidc_login_service}
%{ if oidc_allowed_groups != "[]" || oidc_admin_groups != "[]" ~}
      # Groups come from the issuer's groups claim.
      claim_groups_key: ${oidc_groups_claim}
      manage_groups: true
%{ endif ~}
%{ if oidc_allowed_groups != "[]" ~}
      # auth.jupyterhub_allowed_groups: only members of these IdP groups may
      # log in, whatever allowed_users says.
      allowed_groups: ${oidc_allowed_groups}
%{ endif ~}
%{ if oidc_admin_groups != "[]" ~}
      # auth.superadmin_group administers the hub (and may log in).
      admin_groups: ${oidc_admin_groups}
%{ endif ~}
    Authenticator:
      admin_users: ${admin_users}
%{ if allow_all && oidc_allowed_groups == "[]" ~}
      allow_all: true
%{ else ~}
      allowed_users: ${allowed_users}
%{ endif ~}
    KubeSpawner:
      # Identity contract: static credentials (if any) reach every notebook
      # container via envFrom the module-managed Secret.
      extra_container_config:
        envFrom:
          - secretRef:
              name: ${identity_env_secret}
  # Placement of the hub itself (the proxy follows it).
  nodeSelector: ${hub_node_selector}
  tolerations: ${hub_tolerations}

proxy:
  service:
    type: ClusterIP
  chp:
    nodeSelector: ${hub_node_selector}
    tolerations: ${hub_tolerations}

singleuser:
  serviceAccountName: ${jupyter_single_user_sa_name}
%{ if singleuser_image != "" ~}
  image:
    name: "${split(":", singleuser_image)[0]}"
    tag: "${try(split(":", singleuser_image)[1], "latest")}"
%{ endif ~}
  # Run the docker-stacks startup script (not bare jupyterhub-singleuser) so the
  # CHOWN_* env below is honoured before privileges drop to the notebook user.
  cmd: start-singleuser.sh
  storage:
    # Per-user home: one sub-directory per username on the shared RWX volume.
    type: static
    static:
      pvcName: ${home_claim}
      subPath: "home/{username}"
    # The shared directory (read-write for every user) plus, when the identity
    # contract asks for one, the projected token volume.
    extraVolumes: ${extra_volumes}
    extraVolumeMounts: ${extra_volume_mounts}
  # NFS ignores fsGroup for ownership, so the container must start as root and
  # chown the (freshly created) home sub-path and shared dir to the notebook
  # user before dropping privileges -- handled by the docker-stacks start script.
  uid: 0
  fsGid: 0
  # CHOWN_* plus the identity contract's plain env (region, role ARN, ...).
  extraEnv: ${singleuser_env}
  nodeSelector: ${singleuser_node_selector}
  extraTolerations: ${singleuser_tolerations}

# NOTE: ${password} is intentionally unused for OIDC auth (kept so all auth
# templates accept the same variable set).
