# JupyterHub with per-user logins and no external identity provider: each user
# sets their own password the first time they log in (FirstUseAuthenticator,
# bundled in the z2jh hub image; passwords persist on the hub's PVC). Pair with
# allowed_users so only known usernames can claim an account.
hub:
  config:
    JupyterHub:
      authenticator_class: firstuseauthenticator.FirstUseAuthenticator
    FirstUseAuthenticator:
      min_password_length: 8
    Authenticator:
      admin_users: ${admin_users}
%{ if allow_all ~}
      # No allow list supplied: any username may claim itself on first login.
      # Set jupyterhub_allowed_users for anything beyond a demo.
      allow_all: true
%{ else ~}
      allowed_users: ${allowed_users}
%{ endif ~}

singleuser:
  serviceAccountName: ${jupyter_single_user_sa_name}
%{ if singleuser_image != "" ~}
  image:
    name: "${split(":", singleuser_image)[0]}"
    tag: "${try(split(":", singleuser_image)[1], "latest")}"
%{ endif ~}
  # Run the docker-stacks startup script (not bare jupyterhub-singleuser) so the
  # CHOWN_* env below is honoured before privileges drop to the notebook user.
  cmd: start-singleuser.sh
  storage:
    # Per-user home: one sub-directory per username on the shared EFS volume.
    type: static
    static:
      pvcName: efs-persist
      subPath: "home/{username}"
    # Shared directory visible (read-write) to every user.
    extraVolumes:
      - name: jupyterhub-shared
        persistentVolumeClaim:
          claimName: efs-persist-shared
    extraVolumeMounts:
      - name: jupyterhub-shared
        mountPath: /home/shared
        readOnly: false
  # EFS/NFS ignores fsGroup for ownership, so the container must start as root
  # and chown the (freshly created) home sub-path and shared dir to the notebook
  # user before dropping privileges -- handled by the docker-stacks start script.
  uid: 0
  fsGid: 0
  extraEnv:
    CHOWN_HOME: "yes"
    CHOWN_HOME_OPTS: "-R"
    CHOWN_EXTRA: "/home/shared"

proxy:
  service:
    type: ClusterIP

# NOTE: ${password} is intentionally unused for firstuse auth (kept so all auth
# templates accept the same variable set).
