# kind cluster for examples/kind. One node is enough: the example is sized for
# a laptop or a 4-vCPU GitHub runner, and kind's local-path StorageClass
# serves the RWX claims fine on a single node.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab-platform
nodes:
  - role: control-plane
    # tofu (on the host) configures Keycloak's realm and creates Postgres
    # roles through these NodePorts (examples/kind tenants.tf).
    extraPortMappings:
      - { containerPort: 30080, hostPort: 30080, protocol: TCP }
      - { containerPort: 30432, hostPort: 30432, protocol: TCP }
