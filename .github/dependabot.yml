# Version updates for the two dependency surfaces of an IaC repo: the GitHub
# Actions used by CI/reusable workflows, and the Terraform providers/modules
# pinned in every module and example. Helm chart versions inside *.tf are not
# a Dependabot ecosystem; the module-input pins are watched by the chart-drift
# workflow instead (bump by hand, or with Renovate's helm regex managers).
version: 2

# Every ecosystem waits 7 days after a release before proposing it, so a
# hijacked upstream's malicious version is usually caught and yanked before it
# lands here. Security updates ignore cooldown and still open immediately.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "terraform"
    directories:
      - "/modules/*"
      - "/aws/*"
      - "/examples/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      terraform-providers:
        patterns: ["*"]
