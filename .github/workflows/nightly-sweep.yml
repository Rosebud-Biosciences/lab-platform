name: Nightly Sweep

# Reusable workflow (workflow_call) that destroys orphaned previews: any per-PR
# workspace whose PR is closed or merged. Belt-and-braces for the times a
# preview-down run was missed (force-pushed close, cancelled job, etc.). Wire it
# to a nightly `schedule` in the caller.
#
# Caller example:
#
#   on:
#     schedule:
#       - cron: "17 3 * * *"
#   jobs:
#     sweep:
#       uses: Rosebud-Biosciences/lab-platform/.github/workflows/nightly-sweep.yml@v0.3.0
#       with:
#         role_to_assume: arn:aws:iam::123456789012:role/github-actions-preview-deployer
#         cluster_name: eks-prod
#         tailscale: true
#       secrets:
#         neon_api_key: ${{ secrets.NEON_API_KEY }}
#         ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
#         ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory of the preview Terraform stack"
        type: string
        default: examples/preview
      role_to_assume:
        description: "IAM role ARN for GitHub OIDC (the preview deployer role)"
        type: string
        required: true
      cluster_name:
        description: "Name of the shared EKS cluster"
        type: string
        default: ""
      aws_region:
        description: "AWS region"
        type: string
        default: us-west-2
      tofu_version:
        description: "OpenTofu version"
        type: string
        default: 1.12.6
      extra_destroy_args:
        description: "Additional args appended to `tofu destroy` (parity with preview-down; needed if the stack has required variables beyond preview_name/cluster_name/region)"
        type: string
        default: ""
      tailscale:
        description: "Connect to Tailscale before destroy"
        type: boolean
        default: false
      workspace_pattern:
        description: "Regex matching preview workspace names of the form pr<number>"
        type: string
        default: "^pr[0-9]+$"
      iam_path:
        description: "IAM path of the preview stack's roles and policies (aws/bootstrap's preview_iam_path). The sweep deletes those whose name belongs to no live preview; empty skips it"
        type: string
        default: /preview/
      iam_min_age_hours:
        description: "Leave younger roles and policies alone: a preview being created right now has no workspace yet"
        type: number
        default: 24
    secrets:
      neon_api_key:
        required: false
      ts_oauth_client_id:
        required: false
      ts_oauth_secret:
        required: false
      modules_git_token:
        description: "Token with read access to the repository the module sources point at, when it is private (see the step that uses it)"
        required: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.neon_api_key }}
      TF_VAR_neon_api_key: ${{ secrets.neon_api_key }}
      MODULES_GIT_TOKEN: ${{ secrets.modules_git_token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Connect to Tailscale
        if: ${{ inputs.tailscale }}
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: tag:ci
          version: latest

      # Module sources under github.com/<org>/... are fetched with git, and the
      # runner's own GITHUB_TOKEN reaches only its own repository. Consuming a
      # PRIVATE platform repo therefore needs a token of its own: a fine-grained
      # PAT (or GitHub App token) with read-only Contents on that repo, passed
      # as the modules_git_token secret. Leave it unset once the repo is public.
      - name: Authenticate module fetches
        if: ${{ env.MODULES_GIT_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${MODULES_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tofu_wrapper: false

      - name: Sweep orphaned previews
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          tofu init -input=false
          for ws in $(tofu workspace list | sed 's/[* ]//g' | grep -E "${{ inputs.workspace_pattern }}" || true); do
            num="${ws#pr}"
            state=$(gh pr view "$num" --repo "${{ github.repository }}" --json state -q .state 2>/dev/null || echo "")
            if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
              echo "Sweeping $ws (PR #$num is $state)"
              tofu workspace select "$ws"
              tofu destroy -auto-approve \
                -var "preview_name=$ws" \
                -var "cluster_name=${{ inputs.cluster_name }}" \
                -var "region=${{ inputs.aws_region }}" \
                ${{ inputs.extra_destroy_args }}
              tofu workspace select default
              tofu workspace delete "$ws"
            else
              echo "Keeping $ws (PR #$num state='${state:-unknown}')"
            fi
          done

      # A PR's workflow can create roles under the preview path that no
      # preview's state records, and a failed destroy can leave some behind;
      # either outlives the preview. Every name the preview stack gives
      # carries its preview's name (pr<N>), so whatever names no workspace
      # still standing goes.
      - name: Retire orphaned preview IAM
        if: ${{ inputs.iam_path != '' }}
        working-directory: ${{ inputs.working_directory }}
        env:
          IAM_PATH: ${{ inputs.iam_path }}
          MIN_AGE_HOURS: ${{ inputs.iam_min_age_hours }}
          WORKSPACE_PATTERN: ${{ inputs.workspace_pattern }}
        run: |
          set -euo pipefail
          live=$(tofu workspace list | sed 's/[* ]//g' | grep -E "$WORKSPACE_PATTERN" || true)
          cutoff=$(date -u -d "-${MIN_AGE_HOURS} hours" +%s)
          belongs_to_live() {
            local ws
            for ws in $live; do
              [[ "$1" =~ (^|[-_.])${ws}([-_.]|$) ]] && return 0
            done
            return 1
          }
          retire() { # retire <kind> <name> <created>: whether to delete it
            if belongs_to_live "$2"; then return 1; fi
            if [ "$(date -u -d "$3" +%s)" -ge "$cutoff" ]; then
              echo "Keeping $1 $2: younger than ${MIN_AGE_HOURS}h"
              return 1
            fi
            echo "Retiring $1 $2"
          }

          aws iam list-roles --path-prefix "$IAM_PATH" --query 'Roles[].[RoleName,CreateDate]' --output text |
            while read -r role created; do
              [ -n "$role" ] && retire role "$role" "$created" || continue
              for p in $(aws iam list-role-policies --role-name "$role" --query 'PolicyNames[]' --output text); do
                aws iam delete-role-policy --role-name "$role" --policy-name "$p"
              done
              for a in $(aws iam list-attached-role-policies --role-name "$role" --query 'AttachedPolicies[].PolicyArn' --output text); do
                aws iam detach-role-policy --role-name "$role" --policy-arn "$a"
              done
              aws iam delete-role --role-name "$role" || echo "::warning::could not delete role $role"
            done

          aws iam list-policies --scope Local --path-prefix "$IAM_PATH" \
            --query 'Policies[].[PolicyName,Arn,CreateDate,AttachmentCount]' --output text |
            while read -r policy arn created attached; do
              [ -n "$policy" ] && retire policy "$policy" "$created" || continue
              if [ "$attached" != 0 ]; then
                echo "::warning::policy $policy is still attached to $attached entities; left in place"
                continue
              fi
              for v in $(aws iam list-policy-versions --policy-arn "$arn" --query 'Versions[?!IsDefaultVersion].VersionId' --output text); do
                aws iam delete-policy-version --policy-arn "$arn" --version-id "$v"
              done
              aws iam delete-policy --policy-arn "$arn" || echo "::warning::could not delete policy $policy"
            done
