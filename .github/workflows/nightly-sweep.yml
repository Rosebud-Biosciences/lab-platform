name: Nightly Sweep

# Reusable workflow (workflow_call) that destroys orphaned previews: any per-PR
# workspace whose PR is closed or merged. Belt-and-braces for the times a
# preview-down run was missed (force-pushed close, cancelled job, etc.). Wire it
# to a nightly `schedule` in the caller.
#
# Caller example:
#
#   on:
#     schedule:
#       - cron: "17 3 * * *"
#   jobs:
#     sweep:
#       uses: your-org/terraform-aws-lab-platform/.github/workflows/nightly-sweep.yml@main
#       with:
#         role_to_assume: arn:aws:iam::123456789012:role/github-actions-preview-deployer
#         cluster_name: eks-prod
#         tailscale: true
#       secrets:
#         neon_api_key: ${{ secrets.NEON_API_KEY }}
#         ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
#         ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory of the preview Terraform stack"
        type: string
        default: examples/preview
      role_to_assume:
        description: "IAM role ARN for GitHub OIDC (the preview deployer role)"
        type: string
        required: true
      cluster_name:
        description: "Name of the shared EKS cluster"
        type: string
        default: ""
      aws_region:
        description: "AWS region"
        type: string
        default: us-west-2
      tofu_version:
        description: "OpenTofu version"
        type: string
        default: 1.12.6
      extra_destroy_args:
        description: "Additional args appended to `tofu destroy` (parity with preview-down; needed if the stack has required variables beyond preview_name/cluster_name/region)"
        type: string
        default: ""
      tailscale:
        description: "Connect to Tailscale before destroy"
        type: boolean
        default: false
      workspace_pattern:
        description: "Regex matching preview workspace names of the form pr<number>"
        type: string
        default: "^pr[0-9]+$"
    secrets:
      neon_api_key:
        required: false
      ts_oauth_client_id:
        required: false
      ts_oauth_secret:
        required: false

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.neon_api_key }}
      TF_VAR_neon_api_key: ${{ secrets.neon_api_key }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Connect to Tailscale
        if: ${{ inputs.tailscale }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: tag:ci
          version: latest

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tofu_wrapper: false

      - name: Sweep orphaned previews
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          tofu init -input=false
          for ws in $(tofu workspace list | sed 's/[* ]//g' | grep -E "${{ inputs.workspace_pattern }}" || true); do
            num="${ws#pr}"
            state=$(gh pr view "$num" --repo "${{ github.repository }}" --json state -q .state 2>/dev/null || echo "")
            if [ "$state" = "CLOSED" ] || [ "$state" = "MERGED" ]; then
              echo "Sweeping $ws (PR #$num is $state)"
              tofu workspace select "$ws"
              tofu destroy -auto-approve \
                -var "preview_name=$ws" \
                -var "cluster_name=${{ inputs.cluster_name }}" \
                -var "region=${{ inputs.aws_region }}" \
                ${{ inputs.extra_destroy_args }}
              tofu workspace select default
              tofu workspace delete "$ws"
            else
              echo "Keeping $ws (PR #$num state='${state:-unknown}')"
            fi
          done
