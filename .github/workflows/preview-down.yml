name: Preview Down

# Reusable workflow (workflow_call) that tears down a single preview: `tofu
# destroy` its per-PR workspace (removing the name-prefixed workloads AND the
# copy-on-write Neon branches AND the ephemeral bucket), then deletes the
# workspace. Prod is untouched.
#
# `extra_tfvars_json` mirrors preview-up.yml's: a JSON object (or base64 of
# one) written to <working_directory>/external.auto.tfvars.json before destroy,
# for stacks whose variables have no defaults. Stacks fed by an external data
# provider should default those variables instead, so a teardown needs nothing.
#
# Caller example:
#
#   jobs:
#     down:
#       uses: Rosebud-Biosciences/lab-platform/.github/workflows/preview-down.yml@main
#       with:
#         preview_name: pr${{ github.event.pull_request.number }}
#         role_to_assume: arn:aws:iam::123456789012:role/github-actions-preview-deployer
#         cluster_name: eks-prod
#         tailscale: true
#       secrets:
#         neon_api_key: ${{ secrets.NEON_API_KEY }}
#         ts_oauth_client_id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
#         ts_oauth_secret: ${{ secrets.TS_OAUTH_SECRET }}

on:
  workflow_call:
    inputs:
      preview_name:
        description: "Preview name to destroy (e.g. pr123)"
        type: string
        required: true
      working_directory:
        description: "Directory of the preview Terraform stack"
        type: string
        default: examples/preview
      role_to_assume:
        description: "IAM role ARN for GitHub OIDC (the preview deployer role)"
        type: string
        required: true
      cluster_name:
        description: "Name of the shared EKS cluster"
        type: string
        default: ""
      aws_region:
        description: "AWS region"
        type: string
        default: us-west-2
      tofu_version:
        description: "OpenTofu version"
        type: string
        default: 1.12.6
      tailscale:
        description: "Connect to Tailscale before destroy"
        type: boolean
        default: false
      extra_destroy_args:
        description: "Additional args appended to `tofu destroy`"
        type: string
        default: ""
    secrets:
      neon_api_key:
        required: false
      ts_oauth_client_id:
        required: false
      ts_oauth_secret:
        required: false
      extra_tfvars_json:
        description: "JSON object (or base64 of one) of extra variable values, written to external.auto.tfvars.json before destroy"
        required: false
      modules_git_token:
        description: "Token with read access to the repository the module sources point at, when it is private (see the step that uses it)"
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      NEON_API_KEY: ${{ secrets.neon_api_key }}
      TF_VAR_neon_api_key: ${{ secrets.neon_api_key }}
      MODULES_GIT_TOKEN: ${{ secrets.modules_git_token }}
      EXTRA_TFVARS_JSON: ${{ secrets.extra_tfvars_json }}
      PREVIEW_NAME: ${{ inputs.preview_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - name: Connect to Tailscale
        if: ${{ inputs.tailscale }}
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.ts_oauth_client_id }}
          oauth-secret: ${{ secrets.ts_oauth_secret }}
          tags: tag:ci
          version: latest

      # Module sources under github.com/<org>/... are fetched with git, and the
      # runner's own GITHUB_TOKEN reaches only its own repository. Consuming a
      # PRIVATE platform repo therefore needs a token of its own: a fine-grained
      # PAT (or GitHub App token) with read-only Contents on that repo, passed
      # as the modules_git_token secret. Leave it unset once the repo is public.
      - name: Authenticate module fetches
        if: ${{ env.MODULES_GIT_TOKEN != '' }}
        run: git config --global url."https://x-access-token:${MODULES_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tofu_wrapper: false

      - name: Write external tfvars
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          [ -n "${EXTRA_TFVARS_JSON:-}" ] || exit 0
          if ! printf '%s' "$EXTRA_TFVARS_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            EXTRA_TFVARS_JSON=$(printf '%s' "$EXTRA_TFVARS_JSON" | base64 -d)
          fi
          printf '%s' "$EXTRA_TFVARS_JSON" |
            jq -e 'if type == "object" then . else error("extra_tfvars_json must be a JSON object") end' \
            > external.auto.tfvars.json

      - name: Destroy preview stack
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          tofu init -input=false
          if tofu workspace select "$PREVIEW_NAME" 2>/dev/null; then
            # shellcheck disable=SC2086
            tofu destroy -auto-approve \
              -var "preview_name=$PREVIEW_NAME" \
              -var "cluster_name=${{ inputs.cluster_name }}" \
              -var "region=${{ inputs.aws_region }}" \
              ${{ inputs.extra_destroy_args }}
            tofu workspace select default
            tofu workspace delete "$PREVIEW_NAME"
            echo "Destroyed preview $PREVIEW_NAME"
          else
            echo "No workspace $PREVIEW_NAME; nothing to destroy."
          fi
