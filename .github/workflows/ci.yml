name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Pin the toolchain so local `tofu fmt`/`validate` and CI agree.
  TOFU_VERSION: "1.12.6"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: tofu fmt (check, recursive)
        run: tofu fmt -check -recursive -diff

  validate:
    name: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/workloads
          - modules/neon-branches
          - modules/dex
          - aws/bootstrap
          - aws/network
          - aws/eks-platform
          - aws/s3-bucket
          - aws/preview-storage
          - aws/iceberg-branches
          - aws/data-access
          - aws/data-adapter
          - aws/compute-adapter
          - aws/oidc-provider
          - examples/minimal
          - examples/complete
          - examples/preview
          - examples/jupyterhub
          - examples/kind
          - examples/kind-aws-data
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: tofu init (no backend)
        run: tofu -chdir=${{ matrix.dir }} init -backend=false
      - name: tofu validate
        run: tofu -chdir=${{ matrix.dir }} validate

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
      - run: tflint --init
      - name: tflint (recursive)
        run: tflint --recursive --config "$(pwd)/.tflint.hcl"

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One tree per run: the portable modules and the AWS backend.
        dir: [modules, aws]
    steps:
      - uses: actions/checkout@v7
      # Repo-wide exceptions live in .checkov.yml with their reasons; per-resource
      # ones are inline next to the resource. The gate stays hard.
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.dir }}
          framework: terraform
          config_file: .checkov.yml
          quiet: true
          soft_fail: false

  docs:
    name: terraform-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify generated module docs are up to date
        uses: terraform-docs/gh-actions@v1
        with:
          working-dir: modules/workloads,modules/neon-branches,modules/dex,aws/bootstrap,aws/network,aws/eks-platform,aws/s3-bucket,aws/preview-storage,aws/iceberg-branches,aws/data-access,aws/data-adapter,aws/compute-adapter,aws/oidc-provider
          config-file: .terraform-docs.yml
          output-format: markdown table
          fail-on-diff: true

  test:
    name: tofu test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - modules/workloads
          - modules/neon-branches
          - modules/dex
          - aws/bootstrap
          - aws/network
          - aws/iceberg-branches
          - aws/data-access
          - aws/data-adapter
          - aws/compute-adapter
          - aws/oidc-provider
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: tofu init (no backend)
        run: tofu -chdir=${{ matrix.dir }} init -backend=false
      - name: Run plan-only toggle-matrix tests
        run: tofu -chdir=${{ matrix.dir }} test
